<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 20px; background: #111; color: #fff; }
button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; }
#log { background: #222; padding: 10px; border-radius: 8px; white-space: pre-wrap; font-size: 14px; margin-top: 20px; min-height: 200px; }
</style>
</head>
<body>
<h2>Діагностика</h2>
<button onclick="testGet()">1. Тест GET /health</button>
<button onclick="testGetChallenge()">2. Тест GET /auth/challenge</button>
<button onclick="testPostHealth()">3. Тест POST (простий)</button>
<button onclick="testPostPin()">4. Тест POST /auth/pin-login</button>
<div id="log">Натисни кнопку...</div>

<script>
const API = 'https://flashsmart8-my-day-bot-production.up.railway.app';
const log = document.getElementById('log');
function p(msg) { log.textContent += '\n' + msg; }

async function testGet() {
  log.textContent = 'GET /health...';
  try {
    const r = await fetch(API + '/health');
    p('Status: ' + r.status);
    const t = await r.text();
    p('Body: ' + t);
  } catch (e) {
    p('ERROR: ' + (e instanceof Error ? e.name + ' / ' + e.message : String(e)));
  }
}

async function testGetChallenge() {
  log.textContent = 'GET /auth/challenge...';
  try {
    const r = await fetch(API + '/auth/challenge');
    p('Status: ' + r.status);
    const t = await r.text();
    p('Body: ' + t.substring(0, 100));
  } catch (e) {
    p('ERROR: ' + (e instanceof Error ? e.name + ' / ' + e.message : String(e)));
  }
}

async function testPostHealth() {
  log.textContent = 'POST /health (звичайний POST)...';
  try {
    const r = await fetch(API + '/health', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ test: 1 })
    });
    p('Status: ' + r.status);
    const t = await r.text();
    p('Body: ' + t.substring(0, 200));
  } catch (e) {
    p('ERROR: ' + (e instanceof Error ? e.name + ' / ' + e.message : String(e)));
  }
}

async function testPostPin() {
  log.textContent = 'POST /auth/pin-login...';
  try {
    const r = await fetch(API + '/auth/pin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: 'test-hash-123' })
    });
    p('Status: ' + r.status);
    const t = await r.text();
    p('Body: ' + t.substring(0, 200));
  } catch (e) {
    p('ERROR: ' + (e instanceof Error ? e.name + ' / ' + e.message : String(e)));
  }
}
</script>
</body>
</html>
